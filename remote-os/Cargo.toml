[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/session",
    "crates/capture",
    "crates/input",
    "crates/media",
    "crates/auth",
    "crates/turn",
    "crates/supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
session = { path = "crates/session" }
capture = { path = "crates/capture" }
input = { path = "crates/input" }
media = { path = "crates/media" }
auth = { path = "crates/auth" }
turn = { path = "crates/turn" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
x11rb = { version = "0.13", features = ["xtest"] }
gst = { package = "gstreamer", version = "0.23", features = ["v1_22"] }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.23", features = ["v1_22"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.23", features = ["v1_22"] }
gst-video = { package = "gstreamer-video", version = "0.23", features = ["v1_22"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
